name: build

# 打 v* 标签 → 构建并创建草稿 Release（附 NSIS 安装包）。
# workflow_dispatch → 手动触发，仅构建并把安装包作为 workflow 产物下载，不发 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # 打 tag 时：tauri-action 构建并把 NSIS 安装包挂到对应 tag 的草稿 Release。
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "StepDoc ${{ github.ref_name }}"
          releaseBody: |
            自动构建产物。请在下方 Assets 中下载 Windows 安装包（`*-setup.exe`）。
            测试版本，首次安装时 Windows 可能提示「未知发布者」，可直接继续安装。
          releaseDraft: true
          prerelease: false

      # 手动触发（无 tag）时：只构建，不出 Release。
      - name: Build (manual, no release)
        if: github.event_name == 'workflow_dispatch'
        run: npx tauri build

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepDoc-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
